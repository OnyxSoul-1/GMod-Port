<script>
// 1. Define ALL missing variables and functions the engine expects
window.LogStyledMessage = function(message, style) { console.log(message); };
window.YG2Instance = function() {};

// InitGame: called by the game at startup. Waits for the Unity instance,
// then tells the game the (fake) SDK is ready. Best guess, may need adjusting.
window.myGameInstance = null;
window.InitGame = function() {
  console.log("InitGame called");
  const timer = setInterval(function() {
    if (window.myGameInstance) {
      clearInterval(timer);
      try {
        window.myGameInstance.SendMessage('YG2Instance', 'SetInitializationSDK');
      } catch (e) {
        console.warn("SetInitializationSDK failed:", e);
      }
    }
  }, 100);
};

// Fake data variables
window.environmentData = '{"language":"en","domain":"com","deviceType":"desktop"}';
window.playerData = '{"playerAuth":"rejected","playerName":"unauthorized"}';
window.cloudSaves = 'no data';

// Fake loaders
window.RequestingEnvironmentData = function() { return Promise.resolve(window.environmentData); };
window.InitPlayer = function() { return Promise.resolve(window.playerData); };
window.LoadCloud = function() { return Promise.resolve(window.cloudSaves); };

// 2. Fake Yandex SDK (defines ysdk, which the game reads directly)
const fakePlayer = {
  isAuthorized: () => false,
  getName: () => 'Player',
  getUniqueID: () => '123',
  getPhoto: () => '',
  getPayingStatus: () => 'unknown',
  getData: () => Promise.resolve({}),
  setData: () => Promise.resolve(),
  getStats: () => Promise.resolve({}),
  setStats: () => Promise.resolve()
};

const fakeSdk = {
  environment: {
    app: { id: '0' },
    browser: { lang: 'en' },
    i18n: { lang: 'en', tld: 'com' },
    payload: ''
  },
  deviceInfo: {
    type: 'desktop',
    isMobile: () => false,
    isDesktop: () => true,
    isTablet: () => false,
    isTV: () => false
  },
  features: {
    LoadingAPI: { ready: () => {} },
    GameplayAPI: { start: () => {}, stop: () => {} }
  },
  adv: {
    showFullscreenAdv: (o) => { o && o.callbacks && o.callbacks.onClose && o.callbacks.onClose(true); },
    showRewardedVideo: (o) => {
      if (o && o.callbacks) {
        o.callbacks.onOpen && o.callbacks.onOpen();
        o.callbacks.onRewarded && o.callbacks.onRewarded();
        o.callbacks.onClose && o.callbacks.onClose();
      }
    },
    getBannerAdvStatus: () => Promise.resolve({ stickyAdvIsShowing: false }),
    showBannerAdv: () => Promise.resolve(),
    hideBannerAdv: () => Promise.resolve()
  },
  getPlayer: () => Promise.resolve(fakePlayer),
  getStorage: () => Promise.resolve(window.localStorage),
  getFlags: () => Promise.resolve({}),
  isAvailableMethod: () => Promise.resolve(false),
  feedback: {
    canReview: () => Promise.resolve({ value: false }),
    requestReview: () => Promise.resolve({ feedbackSent: false })
  },
  shortcut: { canShowPrompt: () => Promise.resolve({ canShow: false }) },
  on: () => {}, off: () => {}, dispatchEvent: () => {}
};

window.ysdk = fakeSdk;
window.YaGames = { init: () => Promise.resolve(fakeSdk) };
</script>

<!-- SPLIT FILE MERGER -->
<script>
// Folder where the .bundle files live. If the game still can't find them,
// check your repo and change this one line (see instructions).
const BUNDLE_BASE = "StreamingAssets/aa/WebGL/";

// The game asks for "<Undefined>/something.bundle" because the Yandex server
// path is missing. Point those requests to the local bundle folder instead.
function fixBundleUrl(u) {
  const m = u.match(/(<|%3C)Undefined(>|%3E)\//i);
  if (!m) return u;
  const rest = u.substring(m.index + m[0].length);
  return BUNDLE_BASE + rest;
}

const originalXhrOpen = XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open = function(method, url) {
  const args = Array.prototype.slice.call(arguments);
  args[1] = fixBundleUrl(String(url));
  return originalXhrOpen.apply(this, args);
};

const originalFetch = window.fetch;
window.fetch = async function(url, options) {
if (typeof url === "string" || url instanceof URL) {
  url = fixBundleUrl(url.toString());
} else if (url instanceof Request) {
  const fixedReqUrl = fixBundleUrl(url.url);
  if (fixedReqUrl !== url.url) url = new Request(fixedReqUrl, url);
}
const urlStr = url.toString();
if (urlStr.endsWith('1.4.wasm.br')) {
try {
const parts = await Promise.all([
originalFetch('./Build/1.4.wasm.br.part1').then(r => r.arrayBuffer()),
originalFetch('./Build/1.4.wasm.br.part2').then(r => r.arrayBuffer()),
originalFetch('./Build/1.4.wasm.br.part3').then(r => r.arrayBuffer()),
originalFetch('./Build/1.4.wasm.br.part4').then(r => r.arrayBuffer())
]);
const totalLength = parts.reduce((acc, val) => acc + val.byteLength, 0);
const merged = new Uint8Array(totalLength);
let offset = 0;
for (const part of parts) {
merged.set(new Uint8Array(part), offset);
offset += part.byteLength;
}
return new Response(merged, {
status: 200,
headers: new Headers({ 'Content-Type': 'application/wasm' })
});
} catch (e) {
console.error("Merge failed:", e);
return originalFetch(url, options);
}
}
return originalFetch(url, options);
};
</script>

<!-- UNITY BOOTSTRAP -->
<script>
const buildUrl = "Build";
const loaderUrl = buildUrl + "/1.4.loader.js";
const config = {
dataUrl: buildUrl + "/1.4.data.br",
frameworkUrl: buildUrl + "/1.4.framework.js.br",
codeUrl: buildUrl + "/1.4.wasm.br",
streamingAssetsUrl: "StreamingAssets",
companyName: "DefaultCompany",
productName: "sandbox",
productVersion: "0.1.0"
};

const canvas = document.querySelector("#unity-canvas");
const loadingCover = document.querySelector("#loading-cover");
const spinner = document.querySelector('.spinner');

const script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
createUnityInstance(canvas, config, (progress) => {
spinner.innerText = `Loading... ${Math.round(progress * 100)}%`;
}).then((unityInstance) => {
window.myGameInstance = unityInstance;
loadingCover.style.display = "none";
canvas.focus();
}).catch((message) => {
console.error(message);
spinner.innerText = "Error loading game. Check console (F12)";
});
};
document.body.appendChild(script);
</script>
