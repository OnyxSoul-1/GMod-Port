<!-- Shows errors on screen with a Copy button (delete this block when the game works) -->
<script>
(function () {
  const lines = [];
  let box, text;
  function render() {
    if (!document.body) return;
    if (!box) {
      box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;background:rgba(0,0,0,.88);color:#fff;font:12px monospace;padding:6px;z-index:99999;';
      const copy = document.createElement('button');
      copy.textContent = 'Copy errors';
      copy.style.cssText = 'margin-right:8px;padding:6px 10px;font-size:14px;';
      copy.onclick = function () {
        const t = lines.join('\n');
        if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
        else { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
        copy.textContent = 'Copied!';
        setTimeout(() => copy.textContent = 'Copy errors', 1500);
      };
      const hide = document.createElement('button');
      hide.textContent = 'Hide';
      hide.style.cssText = 'padding:6px 10px;font-size:14px;';
      hide.onclick = () => box.style.display = 'none';
      text = document.createElement('pre');
      text.style.cssText = 'white-space:pre-wrap;margin:6px 0 0;';
      box.append(copy, hide, text);
      document.body.appendChild(box);
    }
    text.textContent = lines.slice(0, 40).join('\n');
  }
  function add(msg) { lines.push(String(msg).slice(0, 600)); render(); }
  window.__boxAdd = add;
  const oErr = console.error;
  console.error = function () { add(Array.from(arguments).join(' ')); oErr.apply(console, arguments); };
  window.addEventListener('error', e => add('ERROR: ' + e.message));
  window.addEventListener('unhandledrejection', e => add('ERROR: ' + (e.reason && e.reason.message || e.reason)));
  document.addEventListener('DOMContentLoaded', render);
})();
</script>

<!-- Joins the 4 split parts of the wasm file back into one file -->
<script>
const originalFetch = window.fetch;
window.fetch = async function (url, options) {
  const urlStr = url.toString();
  if (urlStr.endsWith('1.4.wasm.br')) {
    try {
      const parts = await Promise.all([1, 2, 3, 4].map(n =>
        originalFetch('./Build/1.4.wasm.br.part' + n).then(r => r.arrayBuffer())));
      const merged = new Uint8Array(parts.reduce((a, p) => a + p.byteLength, 0));
      let offset = 0;
      for (const p of parts) { merged.set(new Uint8Array(p), offset); offset += p.byteLength; }
      return new Response(merged, { status: 200, headers: new Headers({ 'Content-Type': 'application/wasm' }) });
    } catch (e) {
      console.error('Merge failed:', e);
    }
  }
  return originalFetch(url, options);
};
</script>

<script>
// ---------- The settings the original game gets from Yandex ("flags") ----------
const REMOTE_BASE = new URL("StreamingAssets/aa/WebGL", location.href).href;
const FLAGS = {
  "MOBILE_TOUCH_PANEL_Y_AXIS_MULTIPLIER": "0.5",
  "GAMEPLAY_ADV_INTERVAL": "240",
  "GAMEPLAY_FIRST_ADV_INTERVAL": "90",
  "MOUSE_SENSITIVITY_MULTIPLIER": "0.3",
  "MOBILE_TOUCH_PANEL_SMOOTH_FACTOR": "18",
  "MOBILE_TOUCH_PANEL_SENSITIVITY_MULTIPLIER": "0.175",
  "FLAG_IS_COMMUNITY_BUTTON_ACTIVE": "true",
  "FLAG_IS_ALL_GAMES_BUTTON_ACTIVE": "true",
  "FLAG_COMMUNITY_LINK": "https://t.me/ItsJasonStudio",
  "FLAG_ALL_GAMES_LINK": "https://yandex.ru/games/developer/97789",
  "USE_CUSTOM_REMOTE_ADDRESSABLES_PATH": "false",
  "CUSTOM_REMOTE_ADDRESSABLES_PATH": REMOTE_BASE,
  "REMOTE_ADDRESSABLES_URL": REMOTE_BASE,
  "VERSION_DEPENDENT_REMOTE_ADDRESSABLES_PATH_1_1": REMOTE_BASE,
  "VERSION_DEPENDENT_REMOTE_ADDRESSABLES_PATH_1_2": REMOTE_BASE,
  "VERSION_DEPENDENT_REMOTE_ADDRESSABLES_PATH_1_3": REMOTE_BASE,
  "VERSION_DEPENDENT_REMOTE_ADDRESSABLES_PATH_1_4": REMOTE_BASE
};

const NO_DATA = 'no data';
const SAVE_KEY = 'gmode_saves';
let ysdk = null, initYSDK = false, ygGameInstance = null, initGame = false, isPausedGame = false;
let cloudSaves = NO_DATA, flasgsData = NO_DATA, environmentData = NO_DATA, playerData = NO_DATA;
let reviewData = 'false', gameLabelData = 'false', allGamesData = NO_DATA;
let pending = [];

function LogStyledMessage(m, style = 'color:#FFDF73;background:#454545') { console.log('%c' + m, style); }

function sendYG2(method, arg) {
  if (arg === undefined) ygGameInstance.SendMessage('YG2Instance', method);
  else ygGameInstance.SendMessage('YG2Instance', method, arg);
}
function YG2Instance(method, arg) {
  if (ygGameInstance == null) return;
  if (!initGame) { pending.push([method, arg]); return; }
  sendYG2(method, arg);
}
function InitGame() {
  initGame = true;
  pending.splice(0).forEach(([m, a]) => sendYG2(m, a));
  if (isPausedGame) YG2Instance('SetPauseGame', 'true');
}

function RequestingEnvironmentData() {
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  environmentData = JSON.stringify({
    language: 'en', domain: 'com', deviceType: mobile ? 'mobile' : 'desktop',
    isMobile: mobile, isDesktop: !mobile, isTablet: false, isTV: false, appID: '448583',
    browserLang: navigator.language || 'en', payload: '', platform: navigator.platform, browser: 'Chrome'
  });
  YG2Instance('SetEnvirData', environmentData);
}
function InitPlayer() {
  playerData = JSON.stringify({ playerAuth: 'rejected', playerName: 'unauthorized', playerId: 'unauthorized', playerPhoto: 'no data', payingStatus: 'unknown' });
  YG2Instance('SetAuth', playerData);
}
function OpenAuthDialog() { LogStyledMessage('Login is not available in this port'); }

function SaveCloud(jsonData) { try { localStorage.setItem(SAVE_KEY, jsonData); } catch (e) {} }
function LoadCloud() {
  let res = NO_DATA;
  try { const v = localStorage.getItem(SAVE_KEY); if (v) res = JSON.stringify([v]); } catch (e) {}
  cloudSaves = res;
  YG2Instance('SetLoadSaves', res);
}

function InterAdvShow() { setTimeout(() => YG2Instance('CloseInterAdv', 'false'), 0); }
function Review() { YG2Instance('ReviewSent', 'false'); }
function GameLabelShowDialog() { YG2Instance('OnGameLabelFail'); }
function SetLeaderboard() {}
function GetLeaderboard() {}

function fakeYandexInit() {
  ysdk = {
    environment: { i18n: { lang: 'en', tld: 'com' }, app: { id: '448583' }, browser: { lang: 'en' }, payload: '' },
    features: { LoadingAPI: { ready() {} }, GameplayAPI: { start() {}, stop() {} } },
    on() {},
    getFlags: () => Promise.resolve(FLAGS)
  };
  RequestingEnvironmentData();
  InitPlayer();
  LoadCloud();
  flasgsData = JSON.stringify({ names: Object.keys(FLAGS), values: Object.values(FLAGS) });
  initYSDK = true;
  LogStyledMessage('Fake Yandex SDK ready. Files are loaded from: ' + REMOTE_BASE);
}

const canvas = document.querySelector('#unity-canvas');
const loadingCover = document.querySelector('#loading-cover');
const barEmpty = document.querySelector('#unity-progress-bar-empty');
const barFull = document.querySelector('#unity-progress-bar-full');

  dataUrl: 'Build/1.4.data.br', frameworkUrl: 'Build/1.4.framework.js.br', codeUrl: 'Build/1.4.wasm.br',
  streamingAssetsUrl: 'StreamingAssets', companyName: 'DefaultCompany', productName: 'sandbox', productVersion: '0.1.0'
};

function FocusGame() { requestAnimationFrame(() => canvas.focus({ preventScroll: true })); }
function SetVisibility(v) { if (initGame) YG2Instance('SetFocusWindowGame', v ? 'true' : 'false'); }
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
window.addEventListener('blur', () => SetVisibility(false));
window.addEventListener('focus', () => SetVisibility(true));
window.addEventListener('pointerdown', () => { FocusGame(); SetVisibility(true); });

const oRequestPointerLock = Element.prototype.requestPointerLock;
Element.prototype.requestPointerLock = async function (...args) {
  try { (args[0] ||= {}).unadjustedMovement = true; await oRequestPointerLock.apply(this, args); }
  catch (err) { try { await oRequestPointerLock.call(this); } catch (e) { console.log(e); } }
};

loadingCover.style.background = "url('Images/background.gif') center / cover";
loadingCover.style.display = '';

const loader = document.createElement('script');
loader.src = 'Build/1.4.loader.js';
loader.onload = () => {
  fakeYandexInit();
  createUnityInstance(canvas, config, (progress) => {
    spinner.style.display = 'none';
    barEmpty.style.display = '';
    barFull.style.width = (100 * Math.max(progress, 0.05)) + '%';
  }).then((unityInstance) => {
    ygGameInstance = unityInstance;
    ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');
    loadingCover.style.display = 'none';
    FocusGame();
  }).catch((message) => {
    console.error(message);
    spinner.style.display = 'none';
  });
};
document.body.appendChild(loader);
</script>
